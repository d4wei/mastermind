name: Interface and tooling tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/node.yml'
      - 'bin/**'
      - 'document/**'
      - 'tests/**'
      - 'themes/**'
      - 'tools/desktop/build-reviewer.mts'
      - 'tools/translation/**'
      - 'ui/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
  pull_request:
    paths: *paths
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
