name: Native Windows package validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/**/*.md'
      - 'tools/desktop/**'
      - '!tools/desktop/*.md'
      - '!tools/desktop/check-results*.json'
      - '.github/workflows/native-windows.yml'
      - 'ui/**'
      - 'document/**'
      - 'tools/translation/**'
      - 'tools/preview/**'
      - 'themes/**'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        working-directory: tools/desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy
          rustup default 1.98.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: desktop
          cache-on-failure: true
      - name: Build the reviewer frontend
        working-directory: .
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --import tsx tools/desktop/build-reviewer.mts
          exit $LASTEXITCODE
      - name: Build Windows release and installer
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tauri.mjs build --features windows-launcher --bundles nsis -- --locked
          exit $LASTEXITCODE
      - name: Native unit tests and lint
        run: |
          cargo test --manifest-path ../../desktop/Cargo.toml --release --locked --all-features
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path ../../desktop/Cargo.toml --release --locked --all-features --all-targets -- -D warnings
          exit $LASTEXITCODE
      - name: Install and exercise the Windows package
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem ../../desktop/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'mastermind-launch-installed'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -PassThru
          if (-not $install.WaitForExit(120000)) { $install.Kill(); throw 'Installer timed out' }
          if ($install.ExitCode) { exit $install.ExitCode }
          python check-windows.py "$destination/mastermind-launch-console.exe" | Tee-Object check-results-windows.json
          exit $LASTEXITCODE
      - name: Check another Windows user cannot access the endpoint
        timeout-minutes: 2
        run: |
          ./check-access.ps1 -Binary "$env:RUNNER_TEMP/mastermind-launch-installed/mastermind-launch-check.exe"
      - name: Install pinned Tauri WebDriver
        timeout-minutes: 10
        run: |
          cargo install tauri-driver --version 2.0.6 --locked
          exit $LASTEXITCODE
      - name: Download Edge driver matching the WebView2 runtime
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $registryPaths = @(
            "Registry::HKEY_CURRENT_USER\Software\Microsoft\EdgeUpdate\Clients\$client",
            "Registry::HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client"
          )
          $version = $null
          foreach ($path in $registryPaths) {
            $candidate = (Get-ItemProperty -Path $path -Name pv -ErrorAction SilentlyContinue).pv
            if ($candidate -match '^\d+\.\d+\.\d+\.\d+$' -and $candidate -ne '0.0.0.0') {
              $version = $candidate
              break
            }
          }
          if (-not $version) { throw 'WebView2 Runtime version is unavailable' }
          Write-Host "WebView2 Runtime: $version"
          $archive = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $directory
          if (-not (Test-Path "$directory/msedgedriver.exe")) { throw 'Edge driver was not extracted' }
      - name: Exercise the installed reviewer through WebDriver
        timeout-minutes: 5
        run: |
          python check-reviewer-windows.py `
            "$env:RUNNER_TEMP/mastermind-launch-installed/mastermind-launch-check.exe" `
            "$env:USERPROFILE/.cargo/bin/tauri-driver.exe" `
            "$env:RUNNER_TEMP/edgedriver/msedgedriver.exe"
          exit $LASTEXITCODE
      - name: Upload observations and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows
          path: |
            tools/desktop/check-results-windows.json
            tools/desktop/check-reviewer-diagnostics/**
            desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
