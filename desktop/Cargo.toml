[package]
name = "mastermind-launch-check"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "mastermind-launch-check"

[[bin]]
name = "mastermind-launch-check"
path = "src/main.rs"

[[bin]]
name = "mastermind-launch-console"
path = "src/bin/launcher.rs"
required-features = ["windows-launcher"]

[features]
windows-launcher = []
readiness-trace = []

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
interprocess = { version = "=2.4.5", features = ["tokio"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "io-util", "time", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
notify = "=8.2.0"
libc = "=0.2.190"
tauri-plugin-dialog = "=2.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSColor"] }

[target.'cfg(windows)'.dependencies]
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
